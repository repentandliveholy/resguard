name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Test workspace
        run: cargo test --workspace

      - name: Check zero-dependency CLI build (--no-default-features)
        run: cargo check --no-default-features -p resguard

      # Validate installer/windows/resguard.iss on every push. Uses a debug build
      # (dependencies are already compiled by `cargo test` above, so this only links
      # the three binaries) and fast compression — the release workflow builds the
      # real installer from the LTO release binaries.
      - name: Build debug binaries for installer check
        if: runner.os == 'Windows'
        run: cargo build --workspace

      - name: Compile Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "resguard-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/debug/resguard.exe, target/debug/rs-tui.exe, target/debug/rs-dash.exe, README.md -Destination $stage
          ./installer/windows/build-installer.ps1 -SourceDir $stage -OutputDir (Join-Path $env:RUNNER_TEMP "resguard-installer") -Compression zip/1
